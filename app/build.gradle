plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.virtualcam.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.virtualcam.app"
        minSdk 21          // el módulo en sí es ligero; LSPatch requiere Android 9+ en la práctica
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // La API de Xposed se usa SOLO en tiempo de compilación: en tiempo de ejecución
    // la provee LSPatch (incrustada en la app parcheada) o LSPosed. No se empaqueta.
    compileOnly project(':xposed-stub')

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
